<h2>“从母图抠层”与“动画原画分层”的区别</h2>
<p class="subtitle">外观静止时可能相同，部件旋转后才会暴露结构差异</p>

<div class="split">
  <div class="mockup">
    <div class="mockup-header">当前方式：只保留母图中可见的像素</div>

<div class="section">
  <p><strong>因此可行的 AI 辅助路线不是“抠图”，而是：</strong>AI 确定统一角色设计，再对身体、头颈、双翅、上下喙分别补画完整轮廓；关节遮挡区需要重绘或局部生成。</p>
</div>
